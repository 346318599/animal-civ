<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="description" content="Animal Civ — Web 单机 Roguelike（动物文明 × 7 阵营 × 回合制 × WFC）" />
  <title>Animal Civ — 动物文明</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-container" aria-label="Animal Civ Game"></div>

  <!-- W2 T2.4 HUD (top overlay) + ActionPanel (bottom overlay) -->
  <div id="hud" role="status" aria-live="polite">
    <div class="hud-row">
      <span class="hud-label">回合</span>
      <span class="hud-value" id="hud-round">—</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">玩家</span>
      <span class="hud-value" id="hud-player">—</span>
    </div>
    <div class="hud-row">
      <span class="hud-label">阶段</span>
      <span class="hud-value" id="hud-phase">—</span>
    </div>
  </div>

  <div id="action-panel" role="toolbar" aria-label="行动面板">
    <button type="button" class="action-btn" data-action="end-turn" disabled>结束回合</button>
    <button type="button" class="action-btn" data-action="move" disabled>移动</button>
    <button type="button" class="action-btn" data-action="attack" disabled>攻击</button>
    <button type="button" class="action-btn" data-action="build" disabled>建造</button>
  </div>

  <!-- Build marker — BattleScene fills this on create(). If you see an old
       hash here, your browser is serving a cached copy. -->
  <div id="build-tag" aria-hidden="true" style="position:fixed;right:6px;bottom:6px;font:11px/1.2 monospace;color:#888;background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:4px;pointer-events:none;z-index:9999;">build=…</div>

  <!-- Phaser 3.90 CDN (主 jsdelivr，备 unpkg) -->
  <script
    src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"
    onerror="this.onerror=null;this.src='https://unpkg.com/phaser@3.90.0/dist/phaser.min.js'"
  ></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
